<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invite unavailable — {{.SiteName}}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  :root { color-scheme: light dark; }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #f7f7f8; color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0e0e11; color: #e6e6e6; }
    .card { background: #17171c; border-color: #2a2a31; }
  }
  main { width: 100%; max-width: 28rem; padding: 1.5rem; }
  .card {
    background: #fff;
    border: 1px solid #e5e5ea;
    border-radius: 14px;
    padding: 2rem 1.75rem;
    text-align: center;
    box-shadow: 0 2px 16px rgba(0,0,0,.04);
  }
  .icon { width: 36px; height: 36px; margin-bottom: 1rem; opacity: .6; color: #b94141; }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 .5rem; }
  .detail { font-size: .95rem; opacity: .85; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <h1>{{.Title}}</h1>
    <p class="detail">{{.Detail}}</p>
  </div>
</main>
</body>
</html>
