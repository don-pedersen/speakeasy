<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome — {{.SiteName}}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="{{.Seconds}};url={{.Path}}">
<style>
  :root { color-scheme: light dark; }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #f7f7f8; color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0e0e11; color: #e6e6e6; }
    .card { background: #17171c; border-color: #2a2a31; }
    .enter { background: #fff; color: #0e0e11; }
  }
  main { width: 100%; max-width: 28rem; padding: 1.5rem; }
  .card {
    background: #fff;
    border: 1px solid #e5e5ea;
    border-radius: 14px;
    padding: 2rem 1.75rem;
    text-align: center;
    box-shadow: 0 2px 16px rgba(0,0,0,.04);
  }
  .lock { width: 36px; height: 36px; margin-bottom: 1rem; opacity: .7; }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 .25rem; }
  .site { font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em; margin: 0 0 1.25rem; }
  .msg {
    font-size: .95rem;
    background: #f2f2f5;
    border-radius: 8px;
    padding: .75rem 1rem;
    margin: 0 0 1.25rem;
    text-align: left;
    white-space: pre-wrap;
  }
  @media (prefers-color-scheme: dark) {
    .msg { background: #23232a; }
  }
  .countdown { font-size: .9rem; opacity: .7; margin: 0 0 1.25rem; }
  .enter {
    display: inline-block;
    background: #1a1a1a; color: #fff;
    padding: .65rem 1.25rem;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 500;
    font-size: .95rem;
    transition: transform .1s ease;
  }
  .enter:hover { transform: translateY(-1px); }
</style>
</head>
<body>
<main>
  <div class="card">
    <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    <h1>You've been invited to</h1>
    <p class="site">{{.SiteName}}</p>
    {{if .Msg}}<p class="msg">{{.Msg}}</p>{{end}}
    <p class="countdown">Entering in <span id="count">{{.Seconds}}</span>…</p>
    <a class="enter" href="{{.Path}}">Enter now →</a>
  </div>
</main>
<script>
  (function () {
    var n = {{.Seconds}};
    var el = document.getElementById('count');
    var timer = setInterval(function () {
      n -= 1;
      if (el) el.textContent = n;
      if (n <= 0) {
        clearInterval(timer);
        window.location.replace({{.Path}});
      }
    }, 1000);
  })();
</script>
</body>
</html>
